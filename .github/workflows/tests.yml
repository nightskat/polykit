name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Tên test/chuỗi tiếng Việt: ép UTF-8 trên Windows (cp1252 mặc định).
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps (requirements-dev.txt)
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q -rs
